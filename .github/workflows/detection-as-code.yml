name: Sentinel Detection-as-Code CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-detections:
    name: Detection-as-Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Validate Sentinel detections
        run: python scripts/validate_dac.py

      - name: Validate ARM JSON syntax
        run: |
          for file in arm/*.json ingestion/dcr-*.json; do
            python -m json.tool "$file" > /dev/null
          done

      - name: Check ingestion Python syntax
        run: python -m py_compile ingestion/scripts/send_test_events.py

      - name: Validate ingestion configuration and regression fixture
        run: python scripts/validate_ingestion.py

      - name: Validate ARM security and source consistency
        run: python scripts/validate_arm.py
