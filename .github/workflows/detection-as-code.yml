name: Sentinel Detection-as-Code CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-detections:
    name: Detection-as-Code Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q scripts

      - name: Validate Sentinel detections
        run: python scripts/validate_dac.py

      - name: Validate ARM JSON syntax
        run: |
          python -m json.tool arm/SOC-LAB-001.json > /dev/null
          python -m json.tool arm/SOC-LAB-002.json > /dev/null

      - name: Validate ARM security and source consistency
        run: python scripts/validate_arm.py
