name: Security Validation CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-validation:
    name: Ingestion and Detection Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          python -m compileall -q \
            adversary-validation \
            detections/tests

      - name: Run ingestion and payload validation tests
        run: |
          python -m unittest discover \
            -s adversary-validation/tests \
            -p "test_*.py" \
            -v

      - name: Run DET-PS-001 detection-pattern tests
        run: |
          python -m unittest discover \
            -s detections/tests \
            -p "test_*.py" \
            -v
