name: Adversary Validation CI

on:
  push:
    branches:
      - main
      - feature/adversary-validation-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  adv001-tests:
    name: ADV-001 PowerShell Detection Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            adversary-validation/detections/adv001_detector.py \
            adversary-validation/tests/test_adv001.py

      - name: Run ADV-001 detection tests
        run: |
          python -m unittest discover \
            -s adversary-validation/tests \
            -p "test_*.py" \
            -v
